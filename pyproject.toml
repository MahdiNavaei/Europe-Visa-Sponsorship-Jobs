[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "europe-visa-sponsorship-jobs"
version = "1.1.4"
description = "Evidence-based European tech job intelligence for non-EU candidates who need visa sponsorship."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mahdi Navaei" }]
dependencies = [
  "alembic>=1.14,<2",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "hatchling>=1.27",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "mypy>=1.13,<2",
  "pip-audit==2.10.1",
  "pyinstaller==6.22.2",
  "ruff>=0.9,<1",
  "types-PyYAML>=6,<7",
]

[dependency-groups]
build = [
  "editables==0.5",
  "hatchling==1.32.0",
]

[project.scripts]
evj-api = "europe_visa_jobs.api.app:run"
evj-ingest = "europe_visa_jobs.ingestion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/europe_visa_jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["europe_visa_jobs"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
