name: Dependency repair

on:
  push:
    branches: [fix/source-health-live-snapshot]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/source-health-live-snapshot
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Repair vulnerable dependency lock
        working-directory: apps/web
        run: |
          npm audit fix --package-lock-only
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build
      - name: Commit repaired lockfile
        shell: bash
        run: |
          if git diff --quiet -- apps/web/package-lock.json apps/web/package.json; then
            echo "Dependency lock is already clean."
            exit 0
          fi
          git config user.name "career-radar-bot"
          git config user.email "career-radar-bot@users.noreply.github.com"
          git add apps/web/package-lock.json apps/web/package.json
          git commit -m "fix(web): refresh vulnerable dependency lock"
          git push origin HEAD:fix/source-health-live-snapshot
