name: Prepare V1 assets

on:
  workflow_dispatch:
  push:
    branches: [phase4-release-hardening]
    paths:
      - ".github/workflows/prepare-v1-assets.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: phase4-release-hardening

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Prepare frontend V1 package
        working-directory: apps/web
        run: |
          npm ci
          npm uninstall framer-motion --save
          npm version 1.0.0 --no-git-tag-version
          npm ci

      - name: Build production frontend
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ""
        run: npm run build

      - name: Capture production screenshots
        working-directory: apps/web
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: ""
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/visual-snapshots.spec.ts --project=chromium

      - name: Install permanent documentation assets
        run: |
          mkdir -p docs/assets
          cp apps/web/artifacts/ui/landing-en.png docs/assets/landing-en.png
          cp apps/web/artifacts/ui/landing-fa.png docs/assets/landing-fa.png
          cp apps/web/artifacts/ui/dashboard-en.png docs/assets/dashboard-en.png
          cp apps/web/artifacts/ui/landing-en-mobile.png docs/assets/landing-en-mobile.png
          cp apps/web/artifacts/ui/dashboard-en-mobile.png docs/assets/dashboard-en-mobile.png

      - name: Commit V1 package and screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json docs/assets
          git diff --cached --quiet && exit 0
          git commit -m "release: prepare frontend 1.0.0 and final screenshots"
          git push origin HEAD:phase4-release-hardening
