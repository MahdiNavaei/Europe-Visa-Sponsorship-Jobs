name: Source discovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Discovery mode
        required: true
        default: recent
        type: choice
        options: [recent, full]
      limit:
        description: Maximum candidates to validate
        required: false
        default: "250"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: market-data-publication
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src:.
      DATABASE_URL: ${{ secrets.SOURCE_STATE_DATABASE_URL }}
      DISCOVERY_TIMEOUT_SECONDS: "15"
      DISCOVERY_RETRY_ATTEMPTS: "2"
      DISCOVERY_CONCURRENCY: "8"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Restore durable branch-backed discovery state when no database secret is configured
        shell: bash
        run: |
          mkdir -p build
          git fetch origin market-data || true
          if [[ -z "$DATABASE_URL" ]]; then
            echo "DATABASE_URL=sqlite:///$GITHUB_WORKSPACE/build/discovery.sqlite" >> "$GITHUB_ENV"
            echo "BRANCH_BACKED_DISCOVERY=1" >> "$GITHUB_ENV"
            if git cat-file -e origin/market-data:data/state/discovery.sqlite.gz 2>/dev/null; then
              git show origin/market-data:data/state/discovery.sqlite.gz | gzip -dc > build/discovery.sqlite
              echo "Restored durable discovery state from market-data"
            fi
          else
            echo "BRANCH_BACKED_DISCOVERY=0" >> "$GITHUB_ENV"
          fi
          if git cat-file -e origin/market-data:source-registry.latest.json 2>/dev/null; then
            git show origin/market-data:source-registry.latest.json > build/source-registry.bootstrap.json
            echo "DISCOVERY_BOOTSTRAP_SNAPSHOT=build/source-registry.bootstrap.json" >> "$GITHUB_ENV"
          else
            echo "DISCOVERY_BOOTSTRAP_SNAPSHOT=config/source-registry.snapshot.json" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements-runtime.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Migrate and bootstrap registry
        run: |
          alembic upgrade head
          evj-ingest sources bootstrap --snapshot "$DISCOVERY_BOOTSTRAP_SNAPSHOT" --config config/sources.json
      - name: Discover and validate public ATS boards
        env:
          DISCOVERY_MODE: ${{ inputs.mode || 'recent' }}
          DISCOVERY_LIMIT: ${{ inputs.limit || '250' }}
        run: evj-ingest sources discover --mode "$DISCOVERY_MODE" --limit "$DISCOVERY_LIMIT"
      - name: Export health and coverage evidence
        run: evj-ingest sources health --json > source-coverage.json
      - name: Confirm durable registry state
        run: test -s source-coverage.json
      - name: Publish latest verified source registry
        run: evj-ingest sources snapshot --output build/source-registry.latest.json --minimum-verified 500
      - name: Snapshot durable discovery SQLite state
        if: env.BRANCH_BACKED_DISCOVERY == '1'
        shell: bash
        run: |
          mkdir -p build/publication/data/state
          cp build/discovery.sqlite build/publication/discovery-public.sqlite
          python - <<'PY'
          from sqlalchemy import create_engine, select
          from sqlalchemy.orm import Session
          from europe_visa_jobs.catalog.delivery import _public_metadata, _public_url
          from europe_visa_jobs.db.models import Source

          engine = create_engine("sqlite:///build/publication/discovery-public.sqlite")
          with Session(engine) as session:
              for source in session.scalars(select(Source)):
                  source.source_metadata = _public_metadata(source.source_metadata or {})
                  source.careers_url = _public_url(source.careers_url)
                  source.board_url = _public_url(source.board_url)
                  source.api_url = _public_url(source.api_url)
              session.commit()
          engine.dispose()
          PY
          gzip -9 -c build/publication/discovery-public.sqlite > build/publication/data/state/discovery.sqlite.gz
          test -s build/publication/data/state/discovery.sqlite.gz
      - name: Persist source registry on market-data branch
        shell: bash
        run: |
          git config user.name "career-radar-bot"
          git config user.email "career-radar-bot@users.noreply.github.com"
          if git show-ref --verify --quiet refs/remotes/origin/market-data; then
            git checkout -B market-data origin/market-data
          else
            git checkout --orphan market-data
            git rm -rf .
          fi
          cp build/source-registry.latest.json source-registry.latest.json
          if [[ "$BRANCH_BACKED_DISCOVERY" == "1" ]]; then
            mkdir -p data/state
            cp build/publication/data/state/discovery.sqlite.gz data/state/discovery.sqlite.gz
          fi
          git checkout --orphan "market-data-discovery-${GITHUB_RUN_ID}"
          git add -A
          git commit -m "data: publish verified source registry ${GITHUB_RUN_ID}"
          git push --force origin HEAD:market-data
