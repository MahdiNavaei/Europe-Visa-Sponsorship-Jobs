name: Source discovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Discovery mode
        required: true
        default: recent
        type: choice
        options: [recent, full]
      limit:
        description: Maximum candidates to validate
        required: false
        default: "250"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: market-data-publication
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src:.
      DATABASE_URL: ${{ secrets.SOURCE_STATE_DATABASE_URL }}
      DISCOVERY_TIMEOUT_SECONDS: "15"
      DISCOVERY_RETRY_ATTEMPTS: "2"
      DISCOVERY_CONCURRENCY: "8"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Migrate and bootstrap registry
        run: |
          test -n "$DATABASE_URL" || (echo "SOURCE_STATE_DATABASE_URL is required for durable discovery state" && exit 1)
          alembic upgrade head
          evj-ingest sources bootstrap --snapshot config/source-registry.snapshot.json --config config/sources.json
      - name: Discover and validate public ATS boards
        env:
          DISCOVERY_MODE: ${{ inputs.mode || 'recent' }}
          DISCOVERY_LIMIT: ${{ inputs.limit || '250' }}
        run: evj-ingest sources discover --mode "$DISCOVERY_MODE" --limit "$DISCOVERY_LIMIT"
      - name: Export health and coverage evidence
        run: evj-ingest sources health --json > source-coverage.json
      - name: Confirm durable registry state
        run: test -s source-coverage.json
      - name: Publish latest verified source registry
        run: evj-ingest sources snapshot --output source-registry.latest.json --minimum-verified 500
      - name: Persist source registry on market-data branch
        shell: bash
        run: |
          git config user.name "career-radar-bot"
          git config user.email "career-radar-bot@users.noreply.github.com"
          git fetch origin market-data || true
          git checkout -B market-data origin/market-data 2>/dev/null || git checkout -B market-data
          git add source-registry.latest.json
          git commit -m "data: publish verified source registry ${GITHUB_RUN_ID}" || echo "No source registry changes"
          git push origin market-data
