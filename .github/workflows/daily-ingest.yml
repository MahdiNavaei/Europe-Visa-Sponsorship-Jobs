name: Recurring catalog ingestion

on:
  schedule:
    # Hourly bounded runs dynamically scale the refresh batch with the verified
    # registry while preserving the documented 25-hour revisit target whenever
    # it can be met inside the runner-safe batch cap.
    - cron: "17 * * * *"
  workflow_dispatch:
  # Workflow edits should exercise the production path immediately instead of
  # waiting for the next cron tick. This is intentionally scoped to this file.
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-ingest.yml"

permissions:
  contents: write

concurrency:
  group: market-data-publication
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Keep a hard publication margin. The ingestion command itself has a
    # smaller wall-clock budget below so a slow 3k+ source batch can never
    # consume the whole job and skip durable state publication again.
    timeout-minutes: 75
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src:.
      REQUEST_TIMEOUT_SECONDS: "15"
      INGESTION_CONCURRENCY: "12"
      INGESTION_REFRESH_INTERVAL_HOURS: "18"
      INGESTION_REFRESH_STALE_SHARE: "0.75"
      INGESTION_MIN_BATCH_SIZE: "150"
      INGESTION_MAX_BATCH_SIZE: "400"
      INGESTION_MAX_REVISIT_HOURS: "25"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore durable branch-backed state when no database secret is configured
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/catalog-seed build/daily-state
          bash scripts/fetch_market_data.sh
          if git show-ref --verify --quiet refs/remotes/origin/market-data; then
            echo "MARKET_DATA_BASE_SHA=$(git rev-parse refs/remotes/origin/market-data)" >> "$GITHUB_ENV"
          else
            echo "MARKET_DATA_BASE_SHA=" >> "$GITHUB_ENV"
          fi
          if [[ -z "$DATABASE_URL" ]]; then
            echo "DATABASE_URL=sqlite:///$GITHUB_WORKSPACE/build/daily.sqlite" >> "$GITHUB_ENV"
            echo "BRANCH_BACKED_SQLITE=1" >> "$GITHUB_ENV"
            if git cat-file -e origin/market-data:data/state/daily.sqlite.gz.manifest.json 2>/dev/null; then
              git show origin/market-data:data/state/daily.sqlite.gz.manifest.json \
                > build/daily-state/daily.sqlite.gz.manifest.json
              while IFS= read -r chunk; do
                git show "origin/market-data:data/state/$chunk" > "build/daily-state/$chunk"
              done < <(
                python3 scripts/branch_state_archive.py list-chunks \
                  --manifest build/daily-state/daily.sqlite.gz.manifest.json
              )
              python3 scripts/branch_state_archive.py restore \
                --manifest build/daily-state/daily.sqlite.gz.manifest.json \
                --output build/daily.sqlite
              echo "Restored chunked durable SQLite ingestion state from market-data"
            elif git cat-file -e origin/market-data:data/state/daily.sqlite.gz 2>/dev/null; then
              # One-release migration path from the legacy single blob. The next
              # successful publication rewrites it as checksum-verified chunks.
              git show origin/market-data:data/state/daily.sqlite.gz | gzip -dc > build/daily.sqlite
              echo "Restored legacy SQLite state; this run will migrate it to chunks"
            else
              echo "No prior SQLite state; this run will bootstrap it"
            fi
          else
            echo "BRANCH_BACKED_SQLITE=0" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements-runtime.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Resolve authoritative source registry snapshot
        shell: bash
        run: |
          mkdir -p build
          if git cat-file -e origin/market-data:source-registry.latest.json 2>/dev/null; then
            git show origin/market-data:source-registry.latest.json > build/source-registry.latest.json
            echo "Using the durable source-discovery publication"
          else
            cp config/source-registry.snapshot.json build/source-registry.latest.json
            echo "Using the checked-in bootstrap snapshot because no publication exists yet"
          fi

      - name: Validate authoritative source snapshot and plan refresh batch
        run: |
          python - <<'PY'
          import os
          from math import ceil

          from europe_visa_jobs.ingestion.sources import load_sources

          sources = load_sources("build/source-registry.latest.json", minimum_snapshot_sources=500)
          assert all("example" not in source.slug.lower() for source in sources)

          source_count = len(sources)
          refresh_interval_hours = int(os.environ["INGESTION_REFRESH_INTERVAL_HOURS"])
          stale_share = float(os.environ["INGESTION_REFRESH_STALE_SHARE"])
          min_batch_size = int(os.environ["INGESTION_MIN_BATCH_SIZE"])
          max_batch_size = int(os.environ["INGESTION_MAX_BATCH_SIZE"])
          max_revisit_hours = int(os.environ["INGESTION_MAX_REVISIT_HOURS"])

          assert 0 < stale_share < 1, "INGESTION_REFRESH_STALE_SHARE must be between zero and one"
          assert 0 < min_batch_size <= max_batch_size, "invalid ingestion batch bounds"
          queue_window_hours = max_revisit_hours - refresh_interval_hours
          assert queue_window_hours > 0, (
              "INGESTION_MAX_REVISIT_HOURS must exceed INGESTION_REFRESH_INTERVAL_HOURS"
          )

          # A board can first become due after refresh_interval_hours. The
          # remaining queue window is therefore the number of hourly runs in
          # which all recurring boards must fit to preserve the revisit bound.
          required_recurring_slots = ceil(source_count / queue_window_hours)
          required_batch_size = max(
              min_batch_size,
              ceil(required_recurring_slots / stale_share),
          )
          batch_size = min(required_batch_size, max_batch_size)
          recurring_slots = ceil(batch_size * stale_share)
          worst_case_hours = refresh_interval_hours + ceil(source_count / recurring_slots)

          if required_batch_size > max_batch_size:
              print(
                  "::warning::Verified registry growth exceeds the runner-safe batch cap; "
                  f"{source_count} boards need batch={required_batch_size} for the "
                  f"{max_revisit_hours}h target, but batch={max_batch_size} will be used. "
                  f"Estimated revisit bound is {worst_case_hours}h. Ingestion will continue "
                  "instead of freezing the catalog."
              )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"INGESTION_BATCH_SIZE={batch_size}\n")

          print(
              f"validated {source_count} live ATS sources; planned batch={batch_size}, "
              f"recurring slots/run={recurring_slots}, bounded revisit≈{worst_case_hours}h"
          )
          PY

      - name: Migrate database
        run: alembic upgrade head

      - name: Load official sponsor evidence before eligibility ingestion
        run: evj-ingest sponsors --production --file data/sponsors.csv.gz

      - name: Bootstrap and validate priority seeds
        run: |
          evj-ingest sources bootstrap --snapshot build/source-registry.latest.json --config config/sources.json
          evj-ingest sources discover --mode recent --method manual --limit 100

      - name: Initialize durable ingestion summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("build/ingestion-summary.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          summary = {
              "selection_mode": "due_for_refresh",
              "refresh_interval_hours": int(os.environ["INGESTION_REFRESH_INTERVAL_HOURS"]),
              "sources_total": int(os.environ["INGESTION_BATCH_SIZE"]),
              "sources_successful": 0,
              "sources_failed": 0,
              "failed_sources": [],
              "partial_success": False,
          }
          output.write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Ingest a fair durable refresh batch within publication budget
        id: ingest_batch
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout --signal=TERM --kill-after=30s 40m \
            evj-ingest jobs --registry --due-for-refresh \
              --limit "$INGESTION_BATCH_SIZE" \
              --allow-partial \
              --summary-file build/ingestion-summary.json
          status=$?
          set -e
          if [[ "$status" -eq 124 || "$status" -eq 137 || "$status" -eq 143 ]]; then
            echo "::warning::Ingestion reached its 40-minute publication budget; completed SQLite commits will still be published and remaining due sources will be retried next run."
            echo "INGESTION_BUDGET_EXHAUSTED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
          echo "INGESTION_BUDGET_EXHAUSTED=0" >> "$GITHUB_ENV"

      - name: Report persisted ingestion result
        run: |
          python - <<'PY'
          from sqlalchemy import func, select
          from europe_visa_jobs.db.models import Job
          from europe_visa_jobs.db.session import SessionLocal

          with SessionLocal() as session:
              active = session.scalar(select(func.count()).select_from(Job).where(Job.active.is_(True))) or 0
              eligible = session.scalar(select(func.count()).select_from(Job).where(Job.active.is_(True), Job.eligibility_status == "eligible")) or 0
              newest = session.scalar(select(func.max(Job.posted_at)).where(Job.active.is_(True)))
          print(f"active_jobs={active} eligible_jobs={eligible} newest_posted_at={newest}")
          if active == 0:
              raise SystemExit("daily ingestion persisted zero active jobs")
          PY

      - name: Publish durable catalog snapshot
        run: python scripts/publish_catalog.py --output build/publication/data/catalog --version "${GITHUB_RUN_ID}"

      - name: Snapshot durable SQLite state
        if: env.BRANCH_BACKED_SQLITE == '1'
        shell: bash
        run: |
          mkdir -p build/publication/data/state
          cp build/daily.sqlite build/publication/daily-public.sqlite
          python - <<'PY'
          from sqlalchemy import create_engine, select
          from sqlalchemy.orm import Session
          from europe_visa_jobs.catalog.delivery import _public_metadata, _public_url
          from europe_visa_jobs.db.models import Source

          engine = create_engine("sqlite:///build/publication/daily-public.sqlite")
          with Session(engine) as session:
              for source in session.scalars(select(Source)):
                  source.source_metadata = _public_metadata(source.source_metadata or {})
                  source.careers_url = _public_url(source.careers_url)
                  source.board_url = _public_url(source.board_url)
                  source.api_url = _public_url(source.api_url)
              session.commit()
          engine.dispose()
          PY
          python scripts/branch_state_archive.py pack \
            --input build/publication/daily-public.sqlite \
            --output-dir build/publication/data/state \
            --prefix daily.sqlite.gz \
            --chunk-size-mib 48
          test -s build/publication/data/state/daily.sqlite.gz.manifest.json
          test -n "$(find build/publication/data/state -name 'daily.sqlite.gz.part-*' -type f -print -quit)"

      - name: Persist catalog and state atomically on market-data branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "career-radar-bot"
          git config user.email "career-radar-bot@users.noreply.github.com"
          if git show-ref --verify --quiet refs/remotes/origin/market-data; then
            git checkout -B market-data origin/market-data
          else
            git checkout --orphan market-data
            git rm -rf .
          fi
          mkdir -p data/catalog data/state
          cp build/publication/data/catalog/* data/catalog/
          # Every market-data writer must preserve the same shared durable payload.
          # Publishing only catalog/state here used to erase the rolling registry on
          # every hourly run, recreating the stale-bootstrap class of failure.
          cp build/source-registry.latest.json source-registry.latest.json
          if [[ "$BRANCH_BACKED_SQLITE" == "1" ]]; then
            rm -f data/state/daily.sqlite.gz \
              data/state/daily.sqlite.gz.manifest.json \
              data/state/daily.sqlite.gz.part-*
            cp build/publication/data/state/daily.sqlite.gz.manifest.json data/state/
            cp build/publication/data/state/daily.sqlite.gz.part-* data/state/
          fi
          python - <<'PY'
          from pathlib import Path
          payloads = sorted(
              Path("data/catalog").glob("catalog-*.json.gz"),
              key=lambda item: item.name,
              reverse=True,
          )
          for expired in payloads[14:]:
              expired.unlink()
          PY
          git checkout --orphan "market-data-catalog-${GITHUB_RUN_ID}"
          # The orphan checkout can retain the previous index; clear it without
          # deleting working-tree files before selecting the public payload.
          git read-tree --empty
          # Keep runner-local build databases and generated diagnostics out of the
          # public data branch; only the shared registry, catalog, and durable state
          # are published.
          git add source-registry.latest.json data/catalog data/state
          unexpected=$(git ls-files | grep -Ev '^(source-registry\.latest\.json|data/(catalog|state)/)' || true)
          if [[ -n "$unexpected" ]]; then
            echo "::error::Refusing to publish unexpected market-data paths:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git commit -m "data: publish catalog ${GITHUB_RUN_ID}"
          git push --force-with-lease="refs/heads/market-data:${MARKET_DATA_BASE_SHA}" \
            origin HEAD:market-data

      - name: Report upstream source failures after durable publication
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path("build/ingestion-summary.json").read_text())
          print(json.dumps(summary, indent=2))
          failed = int(summary.get("sources_failed", 0))
          successful = int(summary.get("sources_successful", 0))
          total = int(summary.get("sources_total", 0))
          processed = successful + failed
          budget_exhausted = os.environ.get("INGESTION_BUDGET_EXHAUSTED") == "1"

          if budget_exhausted:
              print(
                  "::warning::The ingestion wall-clock budget was exhausted, but durable "
                  "SQLite/catalog publication completed; unfinished due sources remain "
                  "eligible for the next hourly run."
              )
          if failed and not summary.get("partial_success") and not budget_exhausted:
              raise SystemExit(f"{failed} source(s) failed and no healthy source data was published")
          if failed:
              print(f"::warning::{failed} source(s) failed; healthy data and state were still published")
          if budget_exhausted and processed < total:
              print(f"::notice::At least {total - processed} selected source(s) were not reflected in the final batch summary before the process budget ended.")
          PY
