name: Daily ingestion

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src:.

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require persistent production database
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "ERROR: DATABASE_URL repository secret is required for persistent daily ingestion."
            echo "The live-ingestion CI test proves public ATS feeds work, but scheduled production ingestion cannot persist without a database."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[postgres]"

      - name: Validate real source catalog
        run: |
          python - <<'PY'
          from europe_visa_jobs.ingestion.sources import load_sources
          sources = load_sources("config/sources.json")
          assert len(sources) >= 8, f"expected a real source catalog, got {len(sources)} sources"
          assert all("example" not in source.slug.lower() for source in sources)
          print(f"validated {len(sources)} live ATS sources")
          PY

      - name: Migrate database
        run: alembic upgrade head

      - name: Bootstrap and validate priority seeds
        run: |
          evj-ingest sources bootstrap --config config/sources.json
          evj-ingest sources discover --mode recent --method manual --limit 100

      - name: Ingest current jobs from verified registry sources
        run: evj-ingest jobs --registry

      - name: Report persisted ingestion result
        run: |
          python - <<'PY'
          from sqlalchemy import func, select
          from europe_visa_jobs.db.models import Job
          from europe_visa_jobs.db.session import SessionLocal

          with SessionLocal() as session:
              active = session.scalar(select(func.count()).select_from(Job).where(Job.active.is_(True))) or 0
              eligible = session.scalar(select(func.count()).select_from(Job).where(Job.active.is_(True), Job.eligibility_status == "eligible")) or 0
              newest = session.scalar(select(func.max(Job.posted_at)).where(Job.active.is_(True)))
          print(f"active_jobs={active} eligible_jobs={eligible} newest_posted_at={newest}")
          if active == 0:
              raise SystemExit("daily ingestion persisted zero active jobs")
          PY
