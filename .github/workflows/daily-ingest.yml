name: Daily ingestion

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-publication
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src:.

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore durable branch-backed state when no database secret is configured
        shell: bash
        run: |
          mkdir -p build/catalog-seed
          git fetch origin market-data || true
          if [[ -z "$DATABASE_URL" ]]; then
            echo "DATABASE_URL=sqlite:///$GITHUB_WORKSPACE/build/daily.sqlite" >> "$GITHUB_ENV"
            echo "BRANCH_BACKED_SQLITE=1" >> "$GITHUB_ENV"
            if git cat-file -e origin/market-data:data/state/daily.sqlite.gz 2>/dev/null; then
              git show origin/market-data:data/state/daily.sqlite.gz | gzip -dc > build/daily.sqlite
              echo "Restored durable SQLite ingestion state from market-data"
            else
              echo "No prior SQLite state; this run will bootstrap it"
            fi
          else
            echo "BRANCH_BACKED_SQLITE=0" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements-runtime.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Resolve authoritative source registry snapshot
        shell: bash
        run: |
          mkdir -p build
          if git cat-file -e origin/market-data:source-registry.latest.json 2>/dev/null; then
            git show origin/market-data:source-registry.latest.json > build/source-registry.latest.json
            echo "Using the durable source-discovery publication"
          else
            cp config/source-registry.snapshot.json build/source-registry.latest.json
            echo "Using the checked-in bootstrap snapshot because no publication exists yet"
          fi

      - name: Validate authoritative source snapshot
        run: |
          python - <<'PY'
          from europe_visa_jobs.ingestion.sources import load_sources
          sources = load_sources("build/source-registry.latest.json", minimum_snapshot_sources=500)
          assert all("example" not in source.slug.lower() for source in sources)
          print(f"validated {len(sources)} live ATS sources")
          PY

      - name: Migrate database
        run: alembic upgrade head

      - name: Load official sponsor evidence before eligibility ingestion
        run: evj-ingest sponsors --production --file data/sponsors.csv.gz

      - name: Bootstrap and validate priority seeds
        run: |
          evj-ingest sources bootstrap --snapshot build/source-registry.latest.json --config config/sources.json
          evj-ingest sources discover --mode recent --method manual --limit 100

      - name: Ingest current jobs from verified registry sources
        run: evj-ingest jobs --registry --allow-partial --summary-file build/ingestion-summary.json

      - name: Report persisted ingestion result
        run: |
          python - <<'PY'
          from sqlalchemy import func, select
          from europe_visa_jobs.db.models import Job
          from europe_visa_jobs.db.session import SessionLocal

          with SessionLocal() as session:
              active = session.scalar(select(func.count()).select_from(Job).where(Job.active.is_(True))) or 0
              eligible = session.scalar(select(func.count()).select_from(Job).where(Job.active.is_(True), Job.eligibility_status == "eligible")) or 0
              newest = session.scalar(select(func.max(Job.posted_at)).where(Job.active.is_(True)))
          print(f"active_jobs={active} eligible_jobs={eligible} newest_posted_at={newest}")
          if active == 0:
              raise SystemExit("daily ingestion persisted zero active jobs")
          PY

      - name: Publish durable catalog snapshot
        run: python scripts/publish_catalog.py --output build/publication/data/catalog --version "${GITHUB_RUN_ID}"

      - name: Snapshot durable SQLite state
        if: env.BRANCH_BACKED_SQLITE == '1'
        shell: bash
        run: |
          mkdir -p build/publication/data/state
          cp build/daily.sqlite build/publication/daily-public.sqlite
          python - <<'PY'
          from sqlalchemy import create_engine, select
          from sqlalchemy.orm import Session
          from europe_visa_jobs.catalog.delivery import _public_metadata, _public_url
          from europe_visa_jobs.db.models import Source

          engine = create_engine("sqlite:///build/publication/daily-public.sqlite")
          with Session(engine) as session:
              for source in session.scalars(select(Source)):
                  source.source_metadata = _public_metadata(source.source_metadata or {})
                  source.careers_url = _public_url(source.careers_url)
                  source.board_url = _public_url(source.board_url)
                  source.api_url = _public_url(source.api_url)
              session.commit()
          engine.dispose()
          PY
          gzip -9 -c build/publication/daily-public.sqlite > build/publication/data/state/daily.sqlite.gz
          test -s build/publication/data/state/daily.sqlite.gz

      - name: Persist catalog and state atomically on market-data branch
        shell: bash
        run: |
          git config user.name "career-radar-bot"
          git config user.email "career-radar-bot@users.noreply.github.com"
          if git show-ref --verify --quiet refs/remotes/origin/market-data; then
            git checkout -B market-data origin/market-data
          else
            git checkout --orphan market-data
            git rm -rf .
          fi
          mkdir -p data/catalog data/state
          cp build/publication/data/catalog/* data/catalog/
          if [[ "$BRANCH_BACKED_SQLITE" == "1" ]]; then
            cp build/publication/data/state/daily.sqlite.gz data/state/daily.sqlite.gz
          fi
          python - <<'PY'
          from pathlib import Path
          payloads = sorted(
              Path("data/catalog").glob("catalog-*.json.gz"),
              key=lambda item: item.name,
              reverse=True,
          )
          for expired in payloads[14:]:
              expired.unlink()
          PY
          git add data/catalog
          if [[ "$BRANCH_BACKED_SQLITE" == "1" ]]; then git add data/state/daily.sqlite.gz; fi
          git commit -m "data: publish catalog ${GITHUB_RUN_ID}" || echo "No catalog changes"
          git push origin market-data

      - name: Report upstream source failures after durable publication
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("build/ingestion-summary.json").read_text())
          print(json.dumps(summary, indent=2))
          if summary["sources_failed"]:
              raise SystemExit(f"{summary['sources_failed']} source(s) failed; healthy data and state were still published")
          PY
