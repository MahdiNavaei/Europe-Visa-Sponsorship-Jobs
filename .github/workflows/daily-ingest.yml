name: Daily ingestion

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$DATABASE_URL" && -f config/sources.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: configure DATABASE_URL secret and config/sources.json to enable scheduled ingestion."
          fi

      - name: Set up Python
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.config.outputs.ready == 'true'
        run: python -m pip install -e ".[postgres]"

      - name: Migrate database
        if: steps.config.outputs.ready == 'true'
        run: alembic upgrade head

      - name: Ingest jobs
        if: steps.config.outputs.ready == 'true'
        run: evj-ingest jobs --sources config/sources.json
