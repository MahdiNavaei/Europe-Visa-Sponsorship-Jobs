name: Refresh official sponsor registry

on:
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sponsor-registry-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build only from the official UKVI and IND registers
        run: |
          mkdir -p build/sponsor-refresh
          python scripts/build_sponsor_registry.py \
            --output build/sponsor-refresh/sponsors.csv.gz \
            --manifest build/sponsor-refresh/sponsors.manifest.json

      - name: Verify fresh provenance and source input hashes
        run: |
          python scripts/build_sponsor_registry.py --validate \
            --output build/sponsor-refresh/sponsors.csv.gz \
            --manifest build/sponsor-refresh/sponsors.manifest.json \
            --max-age-days 1 \
            --require-input-hashes

      - name: Detect material or freshness change
        id: change
        shell: bash
        run: |
          if ! cmp -s build/sponsor-refresh/sponsors.csv.gz data/sponsors.csv.gz; then
            echo "needed=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          manifest = json.loads(Path("data/sponsors.manifest.json").read_text())
          generated = datetime.fromisoformat(manifest["generated_at"].replace("Z", "+00:00"))
          print(f"needed={int((datetime.now(UTC) - generated).days >= 30)}")
          PY

      - name: Open or update reviewable refresh pull request
        if: steps.change.outputs.needed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          branch="automation/sponsor-registry-refresh"
          cp build/sponsor-refresh/sponsors.csv.gz data/sponsors.csv.gz
          cp build/sponsor-refresh/sponsors.manifest.json data/sponsors.manifest.json
          git config user.name "career-radar-bot"
          git config user.email "career-radar-bot@users.noreply.github.com"
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git checkout -B "$branch" "$BASE_BRANCH"
          git add data/sponsors.csv.gz data/sponsors.manifest.json
          git commit -m "data: refresh official sponsor registries"
          git push --force-with-lease origin "$branch"
          if ! gh pr list --head "$branch" --base "$BASE_BRANCH" --state open --json number --jq 'length > 0' | grep -q true; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$branch" \
              --title "data: refresh official sponsor registries" \
              --body "Automated refresh from the official UKVI and IND registers. Dataset size, freshness, provenance URLs, dataset SHA-256, and downloaded-input hashes were validated before this PR was opened."
          fi
