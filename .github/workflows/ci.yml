name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Compile
        run: python -m compileall -q src
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy src scripts --ignore-missing-imports
      - name: Migration smoke test
        env:
          DATABASE_URL: sqlite:///./ci_migration.db
        run: |
          alembic upgrade head
          alembic downgrade base
      - name: Tests with coverage
        run: pytest --cov=europe_visa_jobs --cov-report=term-missing --cov-fail-under=85
      - name: Docker build
        run: docker build --tag europe-visa-sponsorship-jobs:ci .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ""
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser E2E tests
        run: npm run test:e2e
      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ui-snapshots
          path: apps/web/artifacts/ui/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-failures
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: visa_jobs_ci
          POSTGRES_USER: visa_jobs
          POSTGRES_PASSWORD: visa_jobs_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visa_jobs -d visa_jobs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://visa_jobs:visa_jobs_ci@127.0.0.1:5432/visa_jobs_ci
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PostgreSQL runtime
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Migration upgrade and backward-compatibility round trip
        run: |
          alembic upgrade head
          python scripts/seed_demo.py
          alembic downgrade -1
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          python scripts/seed_demo.py
      - name: Live API smoke test on PostgreSQL
        run: |
          uvicorn europe_visa_jobs.api.app:app --host 127.0.0.1 --port 8000 > /tmp/evj-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/api/v1/stats
          curl -fsS 'http://127.0.0.1:8000/api/v1/jobs?limit=5'

  live-ingestion-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: visa_jobs_live
          POSTGRES_USER: visa_jobs
          POSTGRES_PASSWORD: visa_jobs_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visa_jobs -d visa_jobs_live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://visa_jobs:visa_jobs_live@127.0.0.1:5432/visa_jobs_live
      PYTHONPATH: src:.
      WEB_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Validate every configured production ATS feed is live
        run: python scripts/live_source_catalog_check.py
      - name: Migrate live-test database
        run: alembic upgrade head
      - name: Ingest public ATS feeds twice and validate freshness/idempotency/API
        run: python scripts/live_ingestion_e2e.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend
        working-directory: apps/web
        run: npm ci
      - name: Build frontend against the real API
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start real API and production web
        run: |
          uvicorn europe_visa_jobs.api.app:app --host 127.0.0.1 --port 8000 > /tmp/live-api.log 2>&1 &
          echo $! > /tmp/live-api.pid
          (cd apps/web && npm run start -- -H 127.0.0.1 > /tmp/live-web.log 2>&1 & echo $! > /tmp/live-web.pid)
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:3000/en >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/live-api.log || true
          cat /tmp/live-web.log || true
          exit 1
      - name: Browser proves live ATS jobs reach the UI
        working-directory: apps/web
        run: npx playwright test --config=playwright.live.config.ts
      - name: Live E2E diagnostics
        if: failure()
        run: |
          cat /tmp/live-api.log || true
          cat /tmp/live-web.log || true
      - name: Upload live E2E failures
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: live-ingestion-e2e-failures
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Python dependency audit
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .
          pip-audit --local
      - name: Public repository safety audit
        run: python scripts/public_repo_audit.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Frontend dependency audit
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=high

  performance:
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.json
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lighthouse-reports
          path: apps/web/artifacts/lighthouse
          if-no-files-found: warn
          retention-days: 14

  acceptance:
    runs-on: ubuntu-latest
    needs: [test, web, postgres-integration, live-ingestion-e2e, security]
    env:
      POSTGRES_PASSWORD: visa_jobs_acceptance
    steps:
      - name: Checkout fresh repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and start production-like stack
        run: docker compose -f docker-compose.production.yml up -d --build
      - name: Wait for healthy API and web
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:3000/en >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f docker-compose.production.yml ps
          docker compose -f docker-compose.production.yml logs --no-color
          exit 1
      - name: Seed and verify end-to-end runtime
        run: |
          docker compose -f docker-compose.production.yml exec -T api python scripts/seed_demo.py
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/api/v1/stats
          curl -fsS http://127.0.0.1:3000/en | grep -q 'Career'
          curl -fsS http://127.0.0.1:3000/fa >/dev/null
      - name: Production stack logs
        if: failure()
        run: docker compose -f docker-compose.production.yml logs --no-color
      - name: Tear down acceptance stack
        if: always()
        run: docker compose -f docker-compose.production.yml down -v --remove-orphans
