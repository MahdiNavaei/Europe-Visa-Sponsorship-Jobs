name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy src scripts --ignore-missing-imports
      - name: Migration smoke test
        env:
          DATABASE_URL: sqlite:///./ci_migration.db
        run: |
          alembic upgrade head
          alembic downgrade base
      - name: Tests with coverage
        run: pytest --cov=europe_visa_jobs --cov-report=term-missing --cov-fail-under=85
      - name: Docker build
        run: docker build --tag europe-visa-sponsorship-jobs:ci .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ""
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser E2E tests
        run: npm run test:e2e
      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-snapshots
          path: apps/web/artifacts/ui/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failures
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: visa_jobs_ci
          POSTGRES_USER: visa_jobs
          POSTGRES_PASSWORD: visa_jobs_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visa_jobs -d visa_jobs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://visa_jobs:visa_jobs_ci@127.0.0.1:5432/visa_jobs_ci
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PostgreSQL runtime
        run: python -m pip install -e ".[dev,postgres]"
      - name: Migration upgrade and backward-compatibility round trip
        run: |
          alembic upgrade head
          python scripts/seed_demo.py
          alembic downgrade -1
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          python scripts/seed_demo.py
      - name: Live API smoke test on PostgreSQL
        run: |
          uvicorn europe_visa_jobs.api.app:app --host 127.0.0.1 --port 8000 > /tmp/evj-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/api/v1/stats
          curl -fsS 'http://127.0.0.1:8000/api/v1/jobs?limit=5'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Python dependency audit
        run: |
          python -m pip install -e . pip-audit
          pip-audit --local
      - name: Public repository safety audit
        run: python scripts/public_repo_audit.py
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Frontend dependency audit
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=high

  performance:
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.json
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: apps/web/artifacts/lighthouse
          if-no-files-found: warn
          retention-days: 14

  acceptance:
    runs-on: ubuntu-latest
    needs: [test, web, postgres-integration, security]
    env:
      POSTGRES_PASSWORD: visa_jobs_acceptance
    steps:
      - name: Checkout fresh repository
        uses: actions/checkout@v5
      - name: Build and start production-like stack
        run: docker compose -f docker-compose.production.yml up -d --build
      - name: Wait for healthy API and web
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:3000/en >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f docker-compose.production.yml ps
          docker compose -f docker-compose.production.yml logs --no-color
          exit 1
      - name: Seed and verify end-to-end runtime
        run: |
          docker compose -f docker-compose.production.yml exec -T api python scripts/seed_demo.py
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/api/v1/stats
          curl -fsS http://127.0.0.1:3000/en | grep -q 'Career'
          curl -fsS http://127.0.0.1:3000/fa >/dev/null
      - name: Production stack logs
        if: failure()
        run: docker compose -f docker-compose.production.yml logs --no-color
      - name: Tear down acceptance stack
        if: always()
        run: docker compose -f docker-compose.production.yml down -v --remove-orphans
