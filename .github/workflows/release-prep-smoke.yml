name: Release prep and source-health smoke

on:
  push:
    branches: [fix/source-health-live-snapshot]
    paths:
      - ".github/workflows/release-prep-smoke.yml"

permissions:
  contents: write

env:
  PYTHONPATH: src:.

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/source-health-live-snapshot
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Prove source-health rolling snapshot bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          git fetch origin market-data
          git cat-file -e origin/market-data:source-registry.latest.json
          git show origin/market-data:source-registry.latest.json > build/source-registry.bootstrap.json
          test -s build/source-registry.bootstrap.json
          export DATABASE_URL="sqlite:///$GITHUB_WORKSPACE/build/source-health-smoke.sqlite"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          python -m pip install --require-hashes -r requirements-runtime.lock
          python -m pip install --no-build-isolation --no-deps -e .
          alembic upgrade head
          evj-ingest sources bootstrap --snapshot build/source-registry.bootstrap.json --config config/sources.json
          evj-ingest sources health --json > build/source-health-smoke.json
          test -s build/source-health-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          snapshot = json.loads(Path('build/source-registry.bootstrap.json').read_text(encoding='utf-8'))
          health = json.loads(Path('build/source-health-smoke.json').read_text(encoding='utf-8'))
          assert snapshot['generated_at'].startswith('2026-09-')
          assert len(snapshot['sources']) >= 500
          assert health is not None
          print(f"rolling snapshot generated_at={snapshot['generated_at']} sources={len(snapshot['sources'])}")
          PY

      - name: Prepare v1.2.2 metadata and versions
        shell: bash
        run: |
          set -euo pipefail
          VERSION=1.2.2
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'pyproject.toml': [('version = "1.2.1"', 'version = "1.2.2"')],
              'src/europe_visa_jobs/__init__.py': [('__version__ = "1.2.1"', '__version__ = "1.2.2"')],
              'packaging/windows/installer.iss': [('#define AppVersion "1.2.1"', '#define AppVersion "1.2.2"')],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text and new not in text:
                      raise SystemExit(f'expected version pattern not found in {filename}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          cd apps/web
          npm version "$VERSION" --no-git-tag-version
          cd ../..
          cat > .release/request.json <<'EOF'
          {
            "version": "1.2.2",
            "notes_file": ".release/v1.2.2.md"
          }
          EOF
          cat > .release/v1.2.2.md <<'EOF'
          ## Career Radar v1.2.2 — Source Health & Release Durability

          v1.2.2 is a reliability and security patch focused on keeping scheduled source-health checks and packaged releases healthy as registry snapshots age.

          ### Fixed

          - **Source health retry bootstrap** — scheduled health retries now bootstrap from the rolling `market-data/source-registry.latest.json` publication instead of a checked-in snapshot that naturally becomes stale.
          - **Freshness safety preserved** — live rolling snapshots still enforce the normal freshness guard; only the immutable packaged/offline fallback is exempt from wall-clock age checks while retaining schema and minimum-source validation.
          - **Windows packaged fallback** — first-run/offline recovery can safely use the validated bundled registry after release age exceeds the live snapshot freshness window.
          - **Frontend dependency security** — the lockfile was refreshed to remove the high/critical advisories found in the prior dependency graph, including the affected Next.js/js-yaml/sharp chain.
          - **Regression protection** — tests now pin the source-health workflow to the rolling registry path and cover the intended live-vs-packaged snapshot semantics.

          ### Validation

          The release is gated on the repository's complete CI matrix, security audits, PostgreSQL integration, live ATS ingestion/browser E2E, acceptance/performance checks, and the Windows installer/portable runtime smoke tests. A dedicated source-health smoke also bootstraps the current rolling `market-data` registry before this release request is prepared.
          EOF
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          heading = '## 1.2.2 - 2026-09-09\n'
          if heading not in text:
              insert = '''## 1.2.2 - 2026-09-09\n\n- Fixed Source health retry to bootstrap from the rolling market-data registry instead of an aging checked-in snapshot.\n- Kept strict freshness checks for live snapshots while making validated packaged/offline fallbacks age-independent.\n- Hardened Windows fallback packaging and refreshed vulnerable frontend lockfile dependencies.\n- Added regression coverage for source-health bootstrap and snapshot freshness semantics.\n\n'''
              marker = '# Changelog\n\n'
              if marker not in text:
                  raise SystemExit('CHANGELOG header not found')
              text = text.replace(marker, marker + insert, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate prepared release
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_release_inputs.py --require-snapshot
          cd apps/web
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build

      - name: Commit release preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "career-radar-bot"
          git config user.email "career-radar-bot@users.noreply.github.com"
          git add pyproject.toml src/europe_visa_jobs/__init__.py packaging/windows/installer.iss apps/web/package.json apps/web/package-lock.json .release/request.json .release/v1.2.2.md CHANGELOG.md
          git diff --cached --check
          git commit -m "release: prepare v1.2.2"
          git push origin HEAD:fix/source-health-live-snapshot
