name: Windows desktop package

on:
  pull_request:
    paths:
      - "packaging/windows/**"
      - "src/**"
      - "migrations/**"
      - "config/**"
      - "data/**"
      - "apps/web/**"
      - "scripts/**"
      - ".signpath/**"
      - "CODE_SIGNING_POLICY.md"
      - "PRIVACY.md"
      - "pyproject.toml"
      - "alembic.ini"
      - ".github/workflows/windows-package.yml"
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install backend packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Assert packaging imports the checked-out source
        shell: pwsh
        run: |
          $expected = (Resolve-Path "src/europe_visa_jobs").Path
          $actual = (python -c "import europe_visa_jobs; print(europe_visa_jobs.__path__[0])").Trim()
          if ((Resolve-Path $actual).Path -ne $expected) {
            throw "Packaging imported $actual instead of checked-out source $expected"
          }
          $backendVersion = (python -c "import europe_visa_jobs; print(europe_visa_jobs.__version__)").Trim()
          $webVersion = (Get-Content "apps/web/package.json" | ConvertFrom-Json).version
          if ($backendVersion -ne $webVersion) {
            throw "Backend version $backendVersion does not match web version $webVersion"
          }
          python scripts/validate_release_inputs.py --require-snapshot --require-input-hashes

      - name: Resolve release version
        id: release-version
        shell: pwsh
        run: |
          $version = (Get-Content "apps/web/package.json" | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Release version is empty." }
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like "refs/tags/v*" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }

      - name: Install and build web production bundle
        shell: pwsh
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:43127
        run: |
          npm ci
          npm run build

      - name: Build self-contained launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows/app | Out-Null
          New-Item -ItemType Directory -Force build/windows/catalog | Out-Null
          git fetch origin market-data 2>$null
          if (git cat-file -e origin/market-data:data/catalog/latest.json 2>$null) {
            $manifest = git show origin/market-data:data/catalog/latest.json | ConvertFrom-Json
            $payload = [IO.Path]::GetFileName($manifest.payload)
            git show "origin/market-data:data/catalog/latest.json" | Set-Content -Encoding utf8 build/windows/catalog/latest.json
            git show "origin/market-data:data/catalog/$payload" > "build/windows/catalog/$payload"
            Write-Host "Bundled published market catalog $payload"
          } else {
            if ($env:GITHUB_REF -like "refs/tags/v*") {
              throw "No durable market catalog publication exists on market-data; refusing to build a tagged release"
            }
            Write-Warning "No durable market catalog exists yet; bootstrapping a bounded live ATS catalog for this test-only package."
            $env:DATABASE_URL = "sqlite:///./build/windows-package.sqlite"
            python -m alembic upgrade head
            if ($LASTEXITCODE -ne 0) { throw "Windows catalog migration failed." }
            evj-ingest sponsors --production --file data/sponsors.csv.gz
            if ($LASTEXITCODE -ne 0) { throw "Windows sponsor import failed." }
            $sources = Get-Content config/sources.json | ConvertFrom-Json | Select-Object -First 5
            $sources | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 build/windows-live-sources.json
            evj-ingest jobs --sources build/windows-live-sources.json --allow-partial
            if ($LASTEXITCODE -ne 0) { throw "Windows live catalog ingestion failed." }
            python scripts/publish_catalog.py --output build/windows/catalog --version "windows-pr-$env:GITHUB_RUN_ID"
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path build/windows/catalog/latest.json)) {
              throw "Windows live catalog publication failed."
            }
          }

          New-Item -ItemType Directory -Force build/windows/app/runtime | Out-Null
          New-Item -ItemType Directory -Force build/windows/app/web-standalone | Out-Null
          python scripts/write_windows_version_info.py `
            --version "${{ steps.release-version.outputs.version }}" `
            --output build/windows/launcher-version.txt
          if ($LASTEXITCODE -ne 0) { throw "Windows version-resource generation failed." }

          pyinstaller packaging/windows/launcher.py `
            --name CareerRadar `
            --onefile `
            --windowed `
            --clean `
            --noconfirm `
            --paths src `
            --version-file build/windows/launcher-version.txt `
            --collect-all alembic `
            --collect-submodules uvicorn `
            --collect-submodules europe_visa_jobs `
            --hidden-import h11 `
            --hidden-import uvicorn.loops.asyncio `
            --hidden-import uvicorn.protocols.http.h11_impl `
            --add-data "alembic.ini;." `
            --add-data "migrations;migrations" `
            --add-data "config/ranking.yaml;config" `
            --add-data "config/sources.json;config" `
            --add-data "config/source-registry.snapshot.json;config" `
            --add-data "build/windows/catalog;catalog" `
            --add-data "data/sponsors.csv.gz;data" `
            --add-data "data/skills.yaml;data"

          Copy-Item dist/CareerRadar.exe build/windows/app/CareerRadar.exe

          $node = (Get-Command node).Source
          Copy-Item $node build/windows/app/runtime/node.exe

          Copy-Item apps/web/.next/standalone/* build/windows/app/web-standalone -Recurse -Force
          $server = Get-ChildItem build/windows/app/web-standalone -Filter server.js -Recurse |
            Where-Object { $_.FullName -match '[\\/]apps[\\/]web[\\/]server\.js$' } |
            Select-Object -First 1
          if (-not $server) {
            $server = Get-ChildItem build/windows/app/web-standalone -Filter server.js -Recurse | Select-Object -First 1
          }
          if (-not $server) { throw "Next standalone server.js was not produced." }

          $webApp = $server.Directory.FullName
          New-Item -ItemType Directory -Force "$webApp/.next/static" | Out-Null
          Copy-Item apps/web/.next/static/* "$webApp/.next/static" -Recurse -Force
          if (Test-Path apps/web/public) {
            New-Item -ItemType Directory -Force "$webApp/public" | Out-Null
            Copy-Item apps/web/public/* "$webApp/public" -Recurse -Force
          }

          Copy-Item LICENSE build/windows/app/LICENSE.txt

      - name: Validate launcher metadata
        shell: pwsh
        run: |
          $expectedVersion = "${{ steps.release-version.outputs.version }}"
          $info = (Get-Item "build/windows/app/CareerRadar.exe").VersionInfo
          if ($info.ProductName -ne "Career Radar") {
            throw "Launcher ProductName is '$($info.ProductName)' instead of 'Career Radar'."
          }
          if ($info.ProductVersion -ne $expectedVersion) {
            throw "Launcher ProductVersion is '$($info.ProductVersion)' instead of '$expectedVersion'."
          }

      - name: Determine SignPath signing mode
        id: signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          $isRelease = $env:GITHUB_REF -like "refs/tags/v*"
          if (-not $isRelease) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "Non-tag build: Authenticode signing is intentionally skipped."
            exit 0
          }
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) { $missing += "SIGNPATH_API_TOKEN secret" }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)) { $missing += "SIGNPATH_ORGANIZATION_ID variable" }
          if ($missing.Count -gt 0) {
            throw "Tagged Windows releases require SignPath configuration: $($missing -join ', ')"
          }
          "enabled=true" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned launcher for SignPath origin verification
        id: upload-unsigned-launcher
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: career-radar-unsigned-launcher-${{ github.sha }}
          path: build/windows/app/CareerRadar.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign launcher with SignPath
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'career-radar' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_LAUNCHER_ARTIFACT_CONFIGURATION_SLUG || 'launcher' }}
          github-artifact-id: ${{ steps.upload-unsigned-launcher.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/windows/signpath-launcher
          parameters: |
            version: ${{ toJSON(steps.release-version.outputs.version) }}

      - name: Promote and verify signed launcher
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem "build/windows/signpath-launcher" -Filter CareerRadar.exe -Recurse | Select-Object -First 1
          if (-not $signed) { throw "SignPath did not return CareerRadar.exe." }
          Copy-Item $signed.FullName "build/windows/app/CareerRadar.exe" -Force
          $signature = Get-AuthenticodeSignature "build/windows/app/CareerRadar.exe"
          if ($signature.Status -ne "Valid") {
            throw "Launcher signature is not valid: $($signature.Status)"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build installer and portable archive
        shell: pwsh
        run: |
          $version = "${{ steps.release-version.outputs.version }}"
          New-Item -ItemType Directory -Force build/windows/installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DSourceDir=$((Resolve-Path build/windows/app).Path)" `
            "/DOutputDir=$((Resolve-Path build/windows/installer).Path)" `
            packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }

          $portable = (Join-Path (Resolve-Path build/windows/installer).Path "CareerRadar-Portable-v$version.zip")
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          Push-Location build/windows/app
          try {
            & $sevenZip a -tzip $portable ".\*" -mx=7
            if ($LASTEXITCODE -ne 0) { throw "7-Zip portable archive creation failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          $installer = "build/windows/installer/CareerRadar-Setup-v$version.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not created." }
          if (-not (Test-Path $portable)) { throw "Portable archive was not created." }

      - name: Validate installer metadata
        shell: pwsh
        run: |
          $version = "${{ steps.release-version.outputs.version }}"
          $installer = "build/windows/installer/CareerRadar-Setup-v$version.exe"
          $info = (Get-Item $installer).VersionInfo
          if ($info.ProductName -ne "Career Radar") {
            throw "Installer ProductName is '$($info.ProductName)' instead of 'Career Radar'."
          }
          if ($info.ProductVersion -ne $version) {
            throw "Installer ProductVersion is '$($info.ProductVersion)' instead of '$version'."
          }

      - name: Upload unsigned installer for SignPath origin verification
        id: upload-unsigned-installer
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: career-radar-unsigned-installer-${{ github.sha }}
          path: build/windows/installer/CareerRadar-Setup-v${{ steps.release-version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer with SignPath
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'career-radar' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG || 'installer' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/windows/signpath-installer
          parameters: |
            version: ${{ toJSON(steps.release-version.outputs.version) }}

      - name: Promote and verify signed installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.release-version.outputs.version }}"
          $name = "CareerRadar-Setup-v$version.exe"
          $signed = Get-ChildItem "build/windows/signpath-installer" -Filter $name -Recurse | Select-Object -First 1
          if (-not $signed) { throw "SignPath did not return $name." }
          $destination = "build/windows/installer/$name"
          Copy-Item $signed.FullName $destination -Force
          $signature = Get-AuthenticodeSignature $destination
          if ($signature.Status -ne "Valid") {
            throw "Installer signature is not valid: $($signature.Status)"
          }

      - name: Enforce signed tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ steps.release-version.outputs.version }}"
          foreach ($path in @(
            "build/windows/app/CareerRadar.exe",
            "build/windows/installer/CareerRadar-Setup-v$version.exe"
          )) {
            $signature = Get-AuthenticodeSignature $path
            if ($signature.Status -ne "Valid") {
              throw "Tagged release contains an unsigned or invalid executable: $path ($($signature.Status))"
            }
          }

      - name: Generate and verify release checksums
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.release-version.outputs.version }}"
          $installer = "build/windows/installer/CareerRadar-Setup-v$version.exe"
          $portable = "build/windows/installer/CareerRadar-Portable-v$version.zip"
          $hashes = @(
            "{0}  {1}" -f (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower(), (Split-Path $installer -Leaf)
            "{0}  {1}" -f (Get-FileHash $portable -Algorithm SHA256).Hash.ToLower(), (Split-Path $portable -Leaf)
          )
          $hashes | Set-Content build/windows/installer/SHA256SUMS.txt -Encoding ascii
          foreach ($artifact in @($installer, $portable)) {
            $name = Split-Path $artifact -Leaf
            $line = Get-Content build/windows/installer/SHA256SUMS.txt |
              Where-Object { $_ -match "\s$name$" } |
              Select-Object -First 1
            if (-not $line) { throw "Checksum entry is missing for $name." }
            $expected = ($line -split "\s+")[0]
            $actual = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLower()
            if ($expected -ne $actual) { throw "Checksum mismatch for $name." }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload Windows packages before runtime smoke test
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: career-radar-windows-v${{ steps.package.outputs.version }}
          path: |
            build/windows/installer/CareerRadar-Setup-v${{ steps.package.outputs.version }}.exe
            build/windows/installer/CareerRadar-Portable-v${{ steps.package.outputs.version }}.zip
            build/windows/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Validate package contents
        shell: pwsh
        run: |
          $version = "${{ steps.package.outputs.version }}"
          $installer = "build/windows/installer/CareerRadar-Setup-v$version.exe"
          $portable = "build/windows/installer/CareerRadar-Portable-v$version.zip"
          foreach ($path in @($installer, $portable, "build/windows/installer/SHA256SUMS.txt")) {
            if (-not (Test-Path $path)) { throw "Required release file is missing: $path" }
          }

      - name: Silent-install smoke test without Python or Node on PATH
        shell: pwsh
        run: |
          $version = "${{ steps.package.outputs.version }}"
          $installer = (Resolve-Path "build/windows/installer/CareerRadar-Setup-v$version.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "Career Radar Installed"
          $smokeDataDir = Join-Path $env:RUNNER_TEMP "Career Radar Installed Data"
          if (Test-Path -LiteralPath $installDir) { Remove-Item -LiteralPath $installDir -Recurse -Force }
          if (Test-Path -LiteralPath $smokeDataDir) { Remove-Item -LiteralPath $smokeDataDir -Recurse -Force }
          $installerArguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART `"/DIR=$installDir`""
          $installerRun = Start-Process -FilePath $installer -ArgumentList $installerArguments -WindowStyle Hidden -Wait -PassThru
          if ($installerRun.ExitCode -ne 0) { throw "Silent installer failed with exit code $($installerRun.ExitCode)" }
          foreach ($required in @(
            "$installDir/CareerRadar.exe",
            "$installDir/runtime/node.exe",
            "$installDir/web-standalone"
          )) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Installed runtime resource is missing: $required" }
          }

          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          $savedPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:CAREERRADAR_DATA_DIR = $smokeDataDir
          $env:CAREERRADAR_SMOKE_SEED = "1"
          $env:CAREERRADAR_REQUIRE_BUNDLED_CATALOG = "1"
          try {
            $installedSmoke = Start-Process -FilePath "$installDir/CareerRadar.exe" -ArgumentList "--smoke-test" -WindowStyle Hidden -Wait -PassThru
            if ($installedSmoke.ExitCode -ne 0) {
              Get-ChildItem -LiteralPath "$smokeDataDir/logs" -ErrorAction SilentlyContinue |
                ForEach-Object { Get-Content -LiteralPath $_.FullName -ErrorAction SilentlyContinue }
              throw "Installed self-contained runtime smoke test failed with exit code $($installedSmoke.ExitCode)"
            }

            $portableDir = Join-Path $env:RUNNER_TEMP "Career Radar Portable"
            $portableDataDir = Join-Path $env:RUNNER_TEMP "Career Radar Portable Data"
            if (Test-Path -LiteralPath $portableDir) { Remove-Item -LiteralPath $portableDir -Recurse -Force }
            if (Test-Path -LiteralPath $portableDataDir) { Remove-Item -LiteralPath $portableDataDir -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            $portable = (Resolve-Path "build/windows/installer/CareerRadar-Portable-v$version.zip").Path
            & $sevenZip x $portable "-o$portableDir" -y
            if ($LASTEXITCODE -ne 0) { throw "Portable archive extraction failed with exit code $LASTEXITCODE" }
            if (-not (Test-Path -LiteralPath "$portableDir/CareerRadar.exe")) { throw "Portable launcher is missing." }
            if (-not (Test-Path -LiteralPath "$portableDir/runtime/node.exe")) { throw "Portable bundled Node runtime is missing." }
            $env:CAREERRADAR_DATA_DIR = $portableDataDir
            $portableSmoke = Start-Process -FilePath "$portableDir/CareerRadar.exe" -ArgumentList "--smoke-test" -WindowStyle Hidden -Wait -PassThru
            if ($portableSmoke.ExitCode -ne 0) {
              Get-ChildItem -LiteralPath "$portableDataDir/logs" -ErrorAction SilentlyContinue |
                ForEach-Object { Get-Content -LiteralPath $_.FullName -ErrorAction SilentlyContinue }
              throw "Portable self-contained runtime smoke test failed with exit code $($portableSmoke.ExitCode)"
            }
          } finally {
            $env:PATH = $savedPath
            Remove-Item Env:CAREERRADAR_DATA_DIR -ErrorAction SilentlyContinue
            Remove-Item Env:CAREERRADAR_SMOKE_SEED -ErrorAction SilentlyContinue
            Remove-Item Env:CAREERRADAR_REQUIRE_BUNDLED_CATALOG -ErrorAction SilentlyContinue
          }

      - name: Verify two market-data cycles through the same installed runtime
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "Career Radar Installed"
          python scripts/windows_market_cycle_smoke.py --exe "$installDir/CareerRadar.exe"

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download Windows packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: career-radar-windows-v*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/web/package.json').version")
          TAG="v${VERSION}"
          cat > release-notes.md <<EOF
          ## Career Radar ${TAG}

          Evidence-based European visa-sponsorship job intelligence for non-EU candidates.

          ### Windows — easiest way to run
          Download **CareerRadar-Setup-v${VERSION}.exe**, install it, and launch Career Radar from the Start menu. Python, Node.js, Docker, PostgreSQL, and project dependencies are bundled; users do not need to install them separately.

          The desktop runtime stores its local SQLite database under `%LOCALAPPDATA%\\CareerRadar`, synchronizes the centrally published market catalog in the background, and retains a bundled fallback for offline/recovery use.

          Career Radar refreshes monitored sources and publishes updated market data on a scheduled basis. This is evidence-based job intelligence, not legal advice and not a guarantee that an employer will sponsor a particular applicant or publish a new eligible vacancy every calendar day.

          A portable ZIP and SHA-256 checksum file are included as well.

          ### Code signing policy
          Free code signing provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/). Both Windows executables are Authenticode-signed before release publication. See the [Career Radar code signing policy](https://github.com/MahdiNavaei/Europe-Visa-Sponsorship-Jobs/blob/${TAG}/CODE_SIGNING_POLICY.md).

          Advanced developers can use the repository's Docker/PostgreSQL/source installation documented in README.md.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "Career Radar ${TAG}" --notes-file release-notes.md
          fi
