services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: visa_jobs
      POSTGRES_USER: visa_jobs
      POSTGRES_PASSWORD: visa_jobs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visa_jobs -d visa_jobs"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://visa_jobs:visa_jobs@postgres:5432/visa_jobs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
